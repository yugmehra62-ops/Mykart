<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyKart Admin</title><style>body{font-family:Arial;margin:0;background:#f4f6f8}header{background:#2874f0;color:white;padding:16px;display:flex;justify-content:space-between}main{max-width:1000px;margin:auto;padding:16px}.card{background:white;padding:16px;margin:12px 0;border-radius:10px}input,textarea,button{width:100%;padding:11px;margin:6px 0;box-sizing:border-box}button{border:0;border-radius:6px;background:#2874f0;color:#fff;font-weight:bold}.danger{background:#e53935}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{font-size:28px;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}#admin{display:none}.err{color:#c62828}.ok{color:#2e7d32}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>MyKart Admin Panel</b><button id="out" style="width:auto;background:white;color:#2874f0;display:none">Logout</button></header><main><section id="login" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="msg"></p></section><section id="admin"><p id="welcome" class="card"></p><div class="grid"><div class="card">Products<div id="pc" class="stat">0</div></div><div class="card">Orders<div id="oc" class="stat">0</div></div><div class="card">Pending<div id="pending" class="stat">0</div></div></div><div class="card"><h2>Add Product</h2><input id="name" placeholder="Product name"><input id="price" type="number" placeholder="Price"><input id="old" type="number" placeholder="Old price"><input id="cat" placeholder="Category"><input id="stock" type="number" placeholder="Stock"><input id="image" placeholder="Image URL"><textarea id="desc" placeholder="Description"></textarea><button id="add">Add Product</button><p id="pm"></p></div><div class="card"><h2>Products</h2><table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody id="products"></tbody></table></div><div class="card"><h2>Orders</h2><table><thead><tr><th>ID</th><th>User</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,doc,getDoc,collection,getDocs,addDoc,deleteDoc,updateDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyDGZAFtym3sjJyfmCPl8M2W6cKEghcBO80',authDomain:'flipkart-688f5.firebaseapp.com',projectId:'flipkart-688f5',storageBucket:'flipkart-688f5.firebasestorage.app',messagingSenderId:'198611064773',appId:'1:198611064773:web:10736c27d23334e5861dac'});const auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value);$('msg').textContent=''}catch(e){$('msg').className='err';$('msg').textContent='Login failed'}};$('out').onclick=()=>signOut(auth);async function admin(u){let s=await getDoc(doc(db,'admins',u.uid));return s.exists()&&String(s.data().role).toLowerCase()==='admin'}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])}async function products(){let s=await getDocs(collection(db,'products'));$('pc').textContent=s.size;$('products').innerHTML='';s.forEach(d=>{let p=d.data(),tr=document.createElement('tr');tr.innerHTML='<td>'+esc(p.name)+'</td><td>₹'+(p.price||0)+'</td><td>'+(p.stock||0)+'</td><td><button class="danger">Delete</button></td>';tr.querySelector('button').onclick=async()=>{if(confirm('Delete product?')){await deleteDoc(doc(db,'products',d.id));products()}};$('products').appendChild(tr)})}async function orders(){let s=await getDocs(collection(db,'orders'));$('oc').textContent=s.size;let n=0;$('orders').innerHTML='';s.forEach(d=>{let o=d.data(),st=o.status||'pending';if(String(st).toLowerCase()=='pending')n++;let tr=document.createElement('tr');tr.innerHTML='<td>'+d.id+'</td><td>'+esc(o.userEmail||o.email||o.userId)+'</td><td>₹'+(o.total||o.amount||0)+'</td><td>'+esc(st)+'</td><td><button>Ship</button></td>';tr.querySelector('button').onclick=async()=>{await updateDoc(doc(db,'orders',d.id),{status:'shipped'});orders()};$('orders').appendChild(tr)});$('pending').textContent=n}$('add').onclick=async()=>{let name=$('name').value.trim(),price=Number($('price').value);if(!name||!price){$('pm').className='err';$('pm').textContent='Name aur price bharein';return}await addDoc(collection(db,'products'),{name,price,oldPrice:Number($('old').value||0),category:$('cat').value.trim(),stock:Number($('stock').value||0),image:$('image').value.trim(),description:$('desc').value.trim(),createdAt:Date.now()});$('pm').className='ok';$('pm').textContent='Product added';['name','price','old','cat','stock','image','desc'].forEach(x=>$(x).value='');products()};onAuthStateChanged(auth,async u=>{if(!u){$('login').style.display='block';$('admin').style.display='none';$('out').style.display='none';return}try{if(!(await admin(u))){await signOut(auth);$('msg').className='err';$('msg').textContent='This account is not an admin';return}$('login').style.display='none';$('admin').style.display='block';$('out').style.display='block';$('welcome').textContent='Admin verified: '+u.email;await products();await orders()}catch(e){$('msg').className='err';$('msg').textContent='Admin verification failed'}});</script></body></html>
